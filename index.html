<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collecta — Legal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #080D16;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .logo {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #D4A843;
    }

    .subtitle {
      color: rgba(255,255,255,0.40);
      font-size: 0.9rem;
      margin-bottom: 48px;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      display: block;
      background: #0F1622;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 24px;
      text-decoration: none;
      text-align: left;
      transition: border-color 0.2s, background 0.2s;
    }

    .card:hover {
      border-color: #D4A843;
      background: #141C2D;
    }

    .card-title {
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .card-desc {
      color: rgba(255,255,255,0.40);
      font-size: 0.85rem;
    }

    .card-arrow {
      float: right;
      color: #4338CA;
      font-size: 1.2rem;
      margin-top: -2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Collecta</div>
    <p class="subtitle">Documentos legales</p>

    <div class="cards">
      <a class="card" href="terminos-y-condiciones.html">
        <span class="card-arrow">→</span>
        <div class="card-title">Términos y Condiciones</div>
        <div class="card-desc">Reglas de uso, pagos y responsabilidades</div>
      </a>
      <a class="card" href="politica-de-privacidad.html">
        <span class="card-arrow">→</span>
        <div class="card-title">Política de Privacidad</div>
        <div class="card-desc">Cómo recopilamos y protegemos tus datos</div>
      </a>
    </div>
  </div>
</body>
</html>
